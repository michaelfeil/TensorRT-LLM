name: Post-Merge Build

on:
  workflow_dispatch:
    inputs:
      amd64_cuda_archs:
        description: CUDA architectures for amd64
        required: true
        default: "80-real;86-real;90-real;100-real;103-real"
        type: string
      arm64_cuda_archs:
        description: CUDA architectures for arm64
        required: true
        default: "100-real;103-real"
        type: string
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and push multi-arch
    runs-on: depot-ubuntu-24.04-8
    env:
      DEPOT_PROJECT_ID: ${{ secrets.DEPOT_TRTLLM_CI_PROJECT_ID }}
      DEPOT_TOKEN: ${{ secrets.DEPOT_TRTLLM_CI_PROJECT_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Depot builder
        uses: depot/use-action@v1
        with:
          project: ${{ env.DEPOT_PROJECT_ID }}
          token: ${{ env.DEPOT_TOKEN }}

      - name: Build and push multi-arch image
        env:
          CUDA_ARCHS_AMD64: ${{ inputs.amd64_cuda_archs || '80-real;86-real;90-real;100-real;103-real' }}
          CUDA_ARCHS_ARM64: ${{ inputs.arm64_cuda_archs || '100-real;103-real' }}
        run: scripts/build_trtllm_release_image.sh
